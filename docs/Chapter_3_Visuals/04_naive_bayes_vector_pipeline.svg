<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#f8fafc"/>
<text x="700" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Naive Bayes Vector Pipeline</text>
<text x="700" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Evaluated alternative for OCR metadata extraction; the active system uses Regex + Dice fuzzy matching</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="20" text-anchor="middle">
<rect x="35" y="155" width="180" height="105" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="125" y="202" fill="#991b1b">OCR/header</text><text x="125" y="232" fill="#991b1b">text</text>
<rect x="250" y="155" width="180" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="340" y="202">Normalize</text><text x="340" y="232">lowercase</text>
<rect x="465" y="155" width="180" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="555" y="202">Tokenize</text><text x="555" y="232">words &gt; 2 chars</text>
<rect x="680" y="155" width="180" height="105" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="770" y="202">Vocabulary</text><text x="770" y="232">V = 53 tokens</text>
<rect x="895" y="155" width="180" height="105" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="985" y="202">Count vector x</text><text x="985" y="232">[x1 ... xV]</text>
<rect x="1110" y="155" width="255" height="105" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1237" y="202">Multinomial</text><text x="1237" y="232">Naive Bayes</text>
</g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M215 207 H250"/><path d="M430 207 H465"/><path d="M645 207 H680"/><path d="M860 207 H895"/><path d="M1075 207 H1110"/></g>
<rect x="200" y="390" width="1000" height="145" rx="14" fill="white" stroke="#94a3b8" stroke-width="2"/>
<text x="700" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172033">Compute posterior score for every candidate class c</text>
<text x="700" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#172033">score(c) = log P(c) + sum [x_i * log P(token_i | c)]</text>
<text x="700" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Laplace: P(token_i | c) = (count_i,c + 1) / (total_words_c + V)</text>
<path d="M1237 260 V325 H700 V390" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M700 535 V600" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="450" y="600" width="500" height="88" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="700" y="653" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#047857">Highest score = predicted class</text>
<rect x="175" y="735" width="1050" height="55" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="700" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#991b1b">Baseline limitation: corrupted or unseen word tokens receive smoothed/default probabilities</text>
</svg>