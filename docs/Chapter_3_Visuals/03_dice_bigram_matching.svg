<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172033">Dice Bigram Matching</text>
<rect x="55" y="150" width="210" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="160" y="205" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#991b1b">Le@rning Ar3a</text>
<path d="M265 195 H365" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><rect x="365" y="150" width="210" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="470" y="190" text-anchor="middle" font-family="Arial" font-size="20" fill="#172033">Normalize</text><text x="470" y="218" text-anchor="middle" font-family="Arial" font-size="20" fill="#172033">learning area</text>
<path d="M575 195 H675" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><rect x="675" y="135" width="235" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="792" y="177" text-anchor="middle" font-family="Arial" font-size="20" fill="#172033">Character bigrams</text><text x="792" y="215" text-anchor="middle" font-family="Arial" font-size="19" fill="#172033">le, ea, ar, rn, ni...</text>
<path d="M910 195 H1010" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><rect x="1010" y="150" width="145" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1082" y="190" text-anchor="middle" font-family="Arial" font-size="19" fill="#172033">Dice</text><text x="1082" y="218" text-anchor="middle" font-family="Arial" font-size="19" fill="#172033">69.6%</text>
<rect x="220" y="370" width="760" height="125" rx="12" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="600" y="415" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#172033">Dice(A,B) = 2 x shared bigrams / total bigrams</text><text x="600" y="460" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">Score is compared with the acceptance threshold</text>
<path d="M600 495 V545" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="390" y="600" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#047857">Above threshold: accept canonical value</text><text x="850" y="600" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#b91c1c">Below threshold: leave uncertain</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs></svg>