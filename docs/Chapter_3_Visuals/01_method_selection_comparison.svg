<text x="105" y="355" font-family="Arial" font-size="21" fill="#172033">Requires labeled training data</text><text x="105" y="405" font-family="Arial" font-size="21" fill="#172033">Requires feature vectors</text><text x="105" y="455" font-family="Arial" font-size="21" fill="#172033">Needs model maintenance</text><text x="105" y="505" font-family="Arial" font-size="21" fill="#172033">Retraining when values change</text><text x="105" y="555" font-family="Arial" font-size="21" fill="#172033">Word-level OCR sensitivity</text>
