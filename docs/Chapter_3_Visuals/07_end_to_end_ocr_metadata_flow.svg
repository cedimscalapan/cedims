<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<rect width="1500" height="1050" fill="#f8fafc"/>
<text x="750" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">OCR Metadata Flow</text>
<text x="750" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#64748b">OCR text is normalized, checked by Regex, then matched with Dice only when needed</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="22" text-anchor="middle">
<rect x="500" y="125" width="500" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="750" y="169">1. Upload document</text>
<rect x="500" y="245" width="500" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="750" y="289">2. Tesseract.js extracts OCR text</text>
<rect x="500" y="365" width="500" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="750" y="409">3. Normalize text</text>
<rect x="500" y="500" width="500" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="750" y="544">4. Apply Regex rules first</text>
</g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M750 195 V245"/><path d="M750 315 V365"/><path d="M750 435 V500"/><path d="M750 570 V620"/></g>
<polygon points="750,620 870,690 750,760 630,690" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="750" y="683" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">Exact pattern</text><text x="750" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">found?</text>
<path d="M870 690 H1130" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="970" y="672" font-family="Arial,sans-serif" font-size="19" fill="#047857">Yes</text>
<rect x="1130" y="645" width="300" height="90" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1280" y="683" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#047857">Exact metadata</text><text x="1280" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#047857">100% confidence</text>
<path d="M630 690 H360 V820" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="475" y="672" font-family="Arial,sans-serif" font-size="19" fill="#b91c1c">No</text>
<rect x="80" y="820" width="400" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="280" y="858" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">5. Dice fuzzy fallback</text><text x="280" y="887" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">compare character bigrams</text>
<path d="M480 865 H500" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<polygon points="600,805 700,865 600,925 500,865" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="600" y="858" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">Dice score meets</text><text x="600" y="883" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">threshold?</text>
<path d="M700 865 H850" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="765" y="847" font-family="Arial,sans-serif" font-size="18" fill="#047857">Yes</text>
<rect x="850" y="820" width="300" height="90" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1000" y="858" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#047857">Canonical metadata</text><text x="1000" y="887" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#047857">with similarity score</text>
<path d="M600 925 V960 H1290 V820" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="620" y="948" font-family="Arial,sans-serif" font-size="18" fill="#b91c1c">No</text>
<rect x="1150" y="820" width="280" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1290" y="858" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#991b1b">Uncertain result</text><text x="1290" y="887" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#991b1b">no forced assignment</text>
</svg>