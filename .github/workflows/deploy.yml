name: Deploy to OVH VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-deploy:
    name: Verify and deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+, not 20: @supabase/supabase-js constructs a RealtimeClient at
          # import time, which needs a native global WebSocket. Node 20 has
          # none, so SvelteKit's postbuild analyse step crashed on every run.
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Production build verification
        run: npm run build

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY repository secret"; exit 1; }
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST repository secret"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Build and restart application on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo "Missing VPS_USER repository secret"; exit 1; }
          test -n "$VPS_APP_DIR" || { echo "Missing VPS_APP_DIR repository secret"; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_APP_DIR" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          cd "$app_dir"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          exit 1
          REMOTE
